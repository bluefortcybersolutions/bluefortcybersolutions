<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="brand-logo-icon">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Armor with Fortified Bastion Top -->
  <path d="M24 4L8 10V22C8 32.5 14.8 41.8 24 44C33.2 41.8 40 32.5 40 22V10L24 4Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="rgba(6, 182, 212, 0.06)" />
  
  <!-- Fort Bastion Turrets -->
  <path d="M16 14V17M24 12V17M32 14V17" 
        stroke="#38bdf8" 
        stroke-width="2" 
        stroke-linecap="round" />
  
  <!-- Inner Circuit & Central Fortress Core -->
  <path d="M24 17L31 22V29L24 34L17 29V22L24 17Z" 
        fill="url(#coreGrad)" 
        opacity="0.9" />
  
  <!-- Cyber Node Points -->
  <circle cx="24" cy="25.5" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <line x1="24" y1="17" x2="24" y2="23" stroke="#ffffff" stroke-width="1.5" />
  <line x1="17" y1="29" x2="21.5" y2="27" stroke="#ffffff" stroke-width="1.5" />
  <line x1="31" y1="29" x2="26.5" y2="27" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Subtle Outer Circuit Nodes -->
  <circle cx="8" cy="22" r="1.5" fill="#06b6d4" />
  <circle cx="40" cy="22" r="1.5" fill="#06b6d4" />
  <circle cx="24" cy="44" r="1.5" fill="#38bdf8" />
</svg>
